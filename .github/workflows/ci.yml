# CI for the publish-only mirror of @databrill/core-pg-kysely.
#
# This repository's contents are generated by tools/sync-public.sh in the
# Databrill monorepo, and the monorepo runs the full suite (including the
# monorepo-coupled and Docker-dependent tests this repo never receives) before
# anything is synced here. So this workflow is not the primary gate — it is the
# standalone-checkout gate: it proves the mirror builds, checks, and passes its
# own unit tests with no monorepo around it, which is exactly the situation a
# consumer of the published package is in.
#
# The workflow lives ONLY here. It is deliberately absent from the monorepo, so
# the JSR publish credentials (see publish.yml — there are none, it is OIDC)
# and the release machinery stay out of the private repo. sync-public.sh knows
# this: .github/ is in its DEST_PROTECTED list, so a sync never deletes these
# files for being "absent from the source".

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: denoland/setup-deno@v2
              with:
                  # Must track the monorepo's CI pin (.github/workflows/ci.yml there).
                  # The synced files were formatted by that version; a different one
                  # here could fail `fmt:check` on content this repo cannot fix, since
                  # the fix would have to be made upstream and re-synced.
                  deno-version: "2.9.4"

            - name: Restore Deno cache
              uses: actions/cache@v6
              with:
                  key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}-${{ github.sha }}
                  path: ~/.cache/deno
                  restore-keys: |
                      deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}-
                      deno-${{ runner.os }}-

            - run: deno task ci
